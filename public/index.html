<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Room</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='6' y1='22' x2='18' y2='2' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23C9705B'/%3E%3Cstop offset='1' stop-color='%23F4C67D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z'/%3E%3C/svg%3E">
    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="js/client.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="room">
        <header class="room-header">
            <div class="brand-mini">
                <span class="flame-mark" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="flameGradSmall" x1="6" y1="22" x2="18" y2="2" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#c9705b"/>
                                <stop offset="1" stop-color="#f4c67d"/>
                            </linearGradient>
                        </defs>
                        <path fill="url(#flameGradSmall)" d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                    </svg>
                </span>
                <h1 id="welcome-message">Sacred Room</h1>
            </div>

            <div id="user-list" class="presence offline">
                <span class="presence-dot"></span>
                <span class="presence-text">Connecting&hellip;</span>
            </div>

            <div class="header-actions">
                <button class="btn btn-ghost" id="new-chat-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    <span>Clear view</span>
                </button>
                <button class="btn btn-danger-ghost" id="logout-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                    <span>Leave</span>
                </button>
            </div>
        </header>

        <div class="container" aria-live="polite"></div>

        <form class="composer" id="send-container">
            <input type="text" name="messageInp" id="messageInp" placeholder="Write a message&hellip;" autocomplete="off">
            <button class="btn btn-primary" type="submit" aria-label="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
            </button>
        </form>
    </div>
</body>
</html>
