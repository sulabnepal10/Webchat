<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Room</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='6' y1='22' x2='18' y2='2' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23C9705B'/%3E%3Cstop offset='1' stop-color='%23F4C67D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="scene">
        <svg class="arch-glow" viewBox="0 0 440 260" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="archGrad" x1="0" y1="260" x2="0" y2="0" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#e2a159" stop-opacity="0"/>
                    <stop offset="0.55" stop-color="#e2a159" stop-opacity="0.6"/>
                    <stop offset="1" stop-color="#f4c67d" stop-opacity="0.9"/>
                </linearGradient>
            </defs>
            <path d="M20 260 V125 C20 45 100 8 220 8 C340 8 420 45 420 125 V260" fill="none" stroke="url(#archGrad)" stroke-width="1.5"/>
        </svg>

        <main class="arch-card">
            <div class="brand">
                <span class="flame-mark" aria-hidden="true">
                    <svg width="26" height="26" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="flameGrad" x1="6" y1="22" x2="18" y2="2" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#c9705b"/>
                                <stop offset="1" stop-color="#f4c67d"/>
                            </linearGradient>
                        </defs>
                        <path fill="url(#flameGrad)" d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                    </svg>
                </span>
                <h1>Sacred Room</h1>
            </div>
            <p class="tagline">A quiet room, always open.</p>

            <form id="auth-form" novalidate>
                <label class="field">
                    <span class="field-label">Username</span>
                    <input type="text" id="username" placeholder="e.g. moth_and_ember" autocomplete="username" required>
                </label>
                <label class="field">
                    <span class="field-label">Password</span>
                    <input type="password" id="password" placeholder="At least 8 characters" autocomplete="current-password" required>
                </label>

                <p class="error" id="error-message" role="alert"></p>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Enter the room</button>

                <p class="toggle">
                    <span id="toggle-mode-text">New here?</span>
                    <a href="#" id="toggle-mode-link">Create an account</a>
                </p>
            </form>
        </main>
    </div>
    <script>
        const form = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const toggleModeText = document.getElementById('toggle-mode-text');
        const toggleModeLink = document.getElementById('toggle-mode-link');

        let mode = 'login';

        toggleModeLink.addEventListener('click', (event) => {
            event.preventDefault();
            mode = mode === 'login' ? 'register' : 'login';
            errorMessage.textContent = '';
            if (mode === 'login') {
                submitBtn.textContent = 'Enter the room';
                toggleModeText.textContent = 'New here?';
                toggleModeLink.textContent = 'Create an account';
                passwordInput.autocomplete = 'current-password';
            } else {
                submitBtn.textContent = 'Create account';
                toggleModeText.textContent = 'Already have a key?';
                toggleModeLink.textContent = 'Log in instead';
                passwordInput.autocomplete = 'new-password';
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.textContent = '';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            try {
                const response = await fetch(`/api/${mode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();

                if (!response.ok) {
                    errorMessage.textContent = data.error || 'Something went wrong.';
                    return;
                }

                window.location.href = 'index.html';
            } catch {
                errorMessage.textContent = 'Could not reach the server. Please try again.';
            }
        });
    </script>
</body>
</html>
